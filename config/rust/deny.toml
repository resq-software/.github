# Canonical ResQ cargo-deny config — copy to a repo root as deny.toml.
# Encodes docs/standards/02-languages.md (Rust). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Keep [advisories.ignore] in sync with any .cargo/audit.toml in the repo.
ignore = []

[licenses]
version = 2
# Permissive SPDX allowlist. Add others only with a deliberate reason.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MITNFA",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

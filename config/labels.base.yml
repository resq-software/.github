# Canonical ResQ label base — the shared floor every repo's labels carry.
#
# Adopt by REFERENCE, not copy: list this file's raw URL as the first
# `config-file` entry in .github/workflows/label-sync.yml, above the repo's own
# .github/labels.yml. Setup, constraints and the two footguns that bite are in
# config/README.md, section "Issue labels (label-sync)".
#
# ---------------------------------------------------------------------------
# Inclusion rule
# ---------------------------------------------------------------------------
# A name belongs here when it meets EITHER test, and is ORG-WIDE under both:
#
#   (1) Automation depends on the exact string — it is hard-coded in a
#       workflow, labeler.yml, gh-aw front-matter, Dependabot `labels:`, or a
#       .github/release.yml category — in MORE THAN ONE repository.
#
#   (2) Convergent adoption — the name is already live in 12 or more of the
#       org's 21 repositories AND completes an axis this file already carries.
#
# Repo-LOCAL automation stays in the repo's own labels.yml. Dependabot
# ecosystem labels (`deps`, `chore`, `typescript`, `rust`, `python`, `dotnet`,
# `solana`, `ci`), the `area:*` / `pkg:*` / `crate:*` / `service:*` /
# `pipeline:*` / `lib:*` / `tool:*` namespaces, and single-repo agentic labels
# (`automation`, `roadmap`) all fail the org-wide qualifier by design.
#
# Test (2) admits names with no attachments anywhere — the whole S-* family is
# declared in 12 repos and has never been applied to an issue. They are kept
# because a PARTIAL ladder is worse than none: a state, priority or size axis
# that stops halfway forces every repo to invent the missing rungs, which is
# how the 221-name shadow taxonomy grew. If the org retires S-*, it is deleted
# here once instead of in twelve files.
#
# Frequency of *declaration* is not on its own evidence of anything, and the
# axes below are ordered by what applies them, not by how often they appear.
#
# ---------------------------------------------------------------------------
# Disjointness (load-bearing — read before editing)
# ---------------------------------------------------------------------------
# EndBug/label-sync does NOT merge configs by name. It CONCATENATES them: a
# name appearing in both this file and a repo's own labels.yml is emitted
# twice and applied by two concurrent, conflicting API calls under Promise.all.
# There is no precedence and no last-one-wins. Per-repo files must stay
# DISJOINT from this one; they hold additions only.

# --- Change type (C-*) ---------------------------------------------------------
# Applied automatically from the conventional-commit title prefix by
# .github/workflows/conventional-title-labeler.yml (10 repos map exactly these
# seven), and consumed as changelog categories by .github/release.yml (6 repos).
# C-Breaking-Change and C-Security are not title-mapped; they are live in 12
# repos each and complete the axis.
- name: "C-Feature"
  color: "a2eeef"
  description: "New feature or request"
- name: "C-Bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "C-Performance"
  color: "f9d0c4"
  description: "Performance regression or optimization"
- name: "C-Documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "C-Refactor"
  color: "d4c5f9"
  description: "Code refactoring with no behavior change"
- name: "C-Testing"
  color: "c2e0c6"
  description: "Tests and test tooling"
- name: "C-Chore"
  color: "ededed"
  description: "Deps, tooling, or config with no public API change"
- name: "C-Breaking-Change"
  color: "b60205"
  description: "Breaking change to the API or behavior"
- name: "C-Security"
  color: "e4e669"
  description: "Security vulnerability or hardening"

# --- State (S-*) ---------------------------------------------------------------
# Workflow state, applied by hand. Declared in 12 repos, zero attachments
# org-wide — kept under test (2) as a complete ladder. See the note above.
- name: "S-Needs-Triage"
  color: "ededed"
  description: "Needs initial assessment"
- name: "S-In-Progress"
  color: "1d76db"
  description: "Actively being worked on"
- name: "S-Needs-Review"
  color: "fbca04"
  description: "Ready for code review"
- name: "S-Blocked"
  color: "b60205"
  description: "Blocked by external dependency or decision"
- name: "S-Ready-To-Merge"
  color: "0e8a16"
  description: "Approved and ready to be merged"

# --- Priority (P0-P3) ----------------------------------------------------------
# P0 and P1 are stale-bot exemptions (exempt-issue-labels). All four are live
# in 12-13 repos; P1 and P3 currently carry two different colours across the
# org, which this file normalises.
- name: "P0: critical"
  color: "b60205"
  description: "Outage or data loss - drop everything"
- name: "P1: high"
  color: "d93f0b"
  description: "Major impact - fix this sprint"
- name: "P2: medium"
  color: "fbca04"
  description: "Moderate impact - fix soon"
- name: "P3: low"
  color: "0e8a16"
  description: "Minor impact - fix when convenient"

# --- Change size (size/*) ------------------------------------------------------
# Applied by pascalgn/size-label-action v0.5.7. These six are the action's
# defaultSizes buckets (0/10/30/100/500/1000 changed lines) — no repo overrides
# `sizes`, so exactly these six names are reachable and all six are required.
# Five of the six carry 4 different colours across the org today.
- name: "size/XS"
  color: "0e8a16"
  description: "Extra-small change (under 10 lines)"
- name: "size/S"
  color: "56d364"
  description: "Small change (10-29 lines)"
- name: "size/M"
  color: "fbca04"
  description: "Medium change (30-99 lines)"
- name: "size/L"
  color: "d93f0b"
  description: "Large change (100-499 lines)"
- name: "size/XL"
  color: "b60205"
  description: "Extra-large change (500-999 lines)"
- name: "size/XXL"
  color: "5c0102"
  description: "Massive change (1000+ lines) - consider splitting"

# --- Area (A-*) ----------------------------------------------------------------
# Path-derived, from .github/labeler.yml. Only these two are org-wide:
# A-DevOps is a labeler rule in 10 repos and a release.yml category in 6;
# A-Build is a labeler rule in 8. Every other A-* is repo-local.
- name: "A-DevOps"
  color: "1d76db"
  description: "CI/CD, workflows, actions, and git hooks"
- name: "A-Build"
  color: "5319e7"
  description: "Build configuration and toolchain"

# --- Dependency and release automation -----------------------------------------
# dependencies and github-actions are applied by Dependabot `labels:` (7 and 6
# repos); dependencies is also a release.yml category in 6. javascript is a
# Dependabot label in 3 repos and live in 12 with two different colours.
# ignore-for-release and skip-changelog are release.yml `exclude.labels` in 6.
- name: "dependencies"
  color: "0366d6"
  description: "Automated dependency updates"
- name: "github-actions"
  color: "1f6feb"
  description: "GitHub Actions dependency updates"
- name: "javascript"
  color: "f1e05a"
  description: "JavaScript/TypeScript dependency updates"
- name: "ignore-for-release"
  color: "cfd3d7"
  description: "Exclude this PR from generated release notes"
- name: "skip-changelog"
  color: "cfd3d7"
  description: "Omit this PR from the changelog"

# --- Lifecycle and triage ------------------------------------------------------
# stale, pinned and security are read by actions/stale (stale-*-label and
# exempt-*-labels) in 3 repos. needs-triage and refactor are hard-coded in the
# duplicate-code-detector gh-aw front-matter in 13 repos; refactor exists in
# only 7 of those 13, and in 6 of the 7 it is grey and undescribed because a
# bot minted it. agentic-workflows is live in 13 repos, grey and undescribed in
# every one, and declared in none — the clearest case of a bot-minted name.
- name: "needs-triage"
  color: "d876e3"
  description: "Awaiting first maintainer review"
- name: "refactor"
  color: "d4c5f9"
  description: "Refactoring opportunity raised by an agentic workflow"
- name: "agentic-workflows"
  color: "5319e7"
  description: "Raised or maintained by an agentic workflow"
- name: "stale"
  color: "795548"
  description: "No activity for 60 days - will close if it stays quiet"
- name: "pinned"
  color: "006b75"
  description: "Exempt from the stale bot"
- name: "security"
  color: "b60205"
  description: "Security-relevant; exempt from the stale bot"

# --- GitHub defaults -----------------------------------------------------------
# Created by GitHub on every new repository and present in 19-20 of 21. They
# cannot be prevented and delete-other-labels is false, so they are declared
# here to give them one description rather than left to drift.
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or PR already exists"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

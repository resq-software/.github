# Canonical ResQ label base — the shared floor every repo's labels carry.
#
# Adopt by REFERENCE, not copy: list this file's raw URL as the first
# `config-file` entry in .github/workflows/label-sync.yml, above the repo's own
# .github/labels.yml. Setup, constraints and the two footguns that bite are in
# config/README.md, section "Issue labels (label-sync)".
#
# ---------------------------------------------------------------------------
# Population — what every count below was measured over
# ---------------------------------------------------------------------------
# Measured 2026-09-30, 14:30-14:47Z, and re-measured at 14:47Z with every
# figure unchanged. Each one is a count taken then, not an estimate.
#
# One caution, from a mistake made while producing these numbers. The "names
# carrying more than one colour" figure came out 26 on one pass and 25 on
# another. That was NOT the live state moving: it was a case-SENSITIVE compare
# of hex colours. One name is written 512BD4 in one repo and 512bd4 in another
# — the same colour. GitHub's API returns whatever case was written, so compare
# label colours case-INSENSITIVELY or you will count drift that is not there.
# The honest figure is 25, and it held across every reading.
#
# The population is every repository this org owns — public and not — as
# `GET /orgs/<org>/repos?type=all --paginate` returns them, MINUS the temporary
# forks the security-advisory workflow creates. Those forks are scratch space,
# not repositories: their label API returns 404, they hold no labels.yml, and
# counting them is exactly what put the previous revision's figures out. Any
# census that walks repository FILES will over-count them and any census that
# reads the org's declared private-repo counter will under-count them, so
# neither is usable on its own — enumerate, exclude, then count.
#
# Reproduce:
#   gh api '/orgs/<org>/repos?type=all&per_page=100' --paginate \
#     --jq '.[].name' | grep -viE '<advisory-fork pattern>' \
#     | while read -r r; do
#         gh api "/repos/<org>/$r/labels?per_page=100" --paginate \
#           --jq ".[] | [\"$r\", .name, .color] | @tsv"
#       done
#
# Census over that population, 2026-09-30T14:30Z:
#   859  label rows live across the org
#   220  distinct label names
#   132  of those names exist in exactly ONE repo — the shadow taxonomy this
#        file exists to stop growing
#    35  names are live in 12 or more repositories
#    25  names carry more than one colour across repos, comparing hex
#        case-insensitively. 15 of the 25 are in this file, so adopting it
#        settles them.
#
# ---------------------------------------------------------------------------
# Inclusion rule
# ---------------------------------------------------------------------------
# A name belongs here when it passes (1) or (2), subject to (3):
#
#   (1) AUTOMATION depends on the exact string in THREE OR MORE repositories —
#       hard-coded in a workflow, .github/labeler.yml, gh-aw front-matter,
#       Dependabot `labels:`, or a .github/release.yml category.
#
#   (2) CONVERGENT ADOPTION — the name is already live in 12 or more
#       repositories, a clear majority of the org. A name below 12 is admitted
#       only to complete an axis already carried under (1) or (2), because a
#       PARTIAL ladder is worse than none: a state, priority or size axis that
#       stops halfway forces every repo to invent the missing rungs, which is
#       how 132 single-repo names accumulated. Three names enter this way:
#       size/XL (live in 10), C-Chore and C-Testing (live in 9, both also
#       title-mapped).
#
#   (3) ORG-WIDE QUALIFIER. Two families stay in the repo's own labels.yml
#       however many repos use them:
#         - NAMESPACED names — `area:*`, `pkg:*`, `crate:*`, `service:*`,
#           `pipeline:*`, `lib:*`, `tool:*`. They name a path inside one repo.
#           `area:tests` is the only one at 3+ repos and is excluded here.
#         - ALIASES for a concept the base already names once: `deps` (6 repos,
#           Dependabot; duplicates `dependencies`) and `chore` (6 repos,
#           Dependabot; duplicates `C-Chore`). The base carries one name per
#           concept. These should eventually be retired, not promoted.
#
# THE THRESHOLD IN (1) IS THREE, AND IT IS A DECISION, NOT AN ACCIDENT.
# At "more than one repo" the following would also qualify, and are listed here
# with their measured counts so the exclusion is visible and arguable:
#   ci           2 repos — Dependabot `labels:` in one AND a gh-aw
#                safe-outputs.create-issue label in another. It is NOT a
#                Dependabot-only name; the previous revision said so and was
#                wrong. It is live in ZERO repos (see the note at the foot).
#   A-Examples   2 repos — .github/labeler.yml path rule
#   A-Release    2 repos — .github/labeler.yml path rule
#   A-Scripts    2 repos — .github/labeler.yml path rule
# Two repos sharing a path convention is a coincidence; three is a convention.
# A reviewer who prefers the lower bar should say so — those four names move in
# without any other change to this file.
#
# Test (2) admits names with no automation attached anywhere. The whole S-*
# family is declared in 12 repos and has never been applied to a single issue;
# it is kept as a complete ladder, and if the org retires S-*, it is deleted
# here once instead of in twelve files.
#
# Frequency of *declaration* is not on its own evidence of anything, and the
# axes below are ordered by what applies them, not by how often they appear.
#
# ---------------------------------------------------------------------------
# Disjointness (load-bearing — read before editing)
# ---------------------------------------------------------------------------
# EndBug/label-sync does NOT merge configs by name. It CONCATENATES them: a
# name appearing in both this file and a repo's own labels.yml is emitted
# twice and applied by two concurrent, conflicting API calls under Promise.all.
# There is no precedence and no last-one-wins. Per-repo files must stay
# DISJOINT from this one; they hold additions only. 12 repos carry a
# .github/labels.yml today and they declare 359 names that appear below;
# adopting the base means deleting those 359 declarations.
# --- Change type (C-*) ---------------------------------------------------------
# Applied from the conventional-commit title prefix by
# .github/workflows/conventional-title-labeler.yml — 9 repos, each mapping
# exactly the same seven names — and consumed as changelog categories by
# .github/release.yml (6 repos). C-Documentation, C-Chore and C-Testing are
# also .github/labeler.yml path rules (10, 2 and 6 repos).
# C-Breaking-Change is title-applied in exactly ONE repo, on the Conventional
# Commits `!` marker; C-Security is applied by nothing anywhere. Both are live
# in 12 repos and enter under rule (2), completing the axis.
- name: "C-Feature"
  color: "a2eeef"
  description: "New feature or request"
- name: "C-Bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "C-Performance"
  color: "f9d0c4"
  description: "Performance regression or optimization"
- name: "C-Documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "C-Refactor"
  color: "d4c5f9"
  description: "Code refactoring with no behavior change"
- name: "C-Testing"
  color: "c2e0c6"
  description: "Tests and test tooling"
- name: "C-Chore"
  color: "ededed"
  description: "Deps, tooling, or config with no public API change"
- name: "C-Breaking-Change"
  color: "b60205"
  description: "Breaking change to the API or behavior"
- name: "C-Security"
  color: "e4e669"
  description: "Security vulnerability or hardening"

# --- State (S-*) ---------------------------------------------------------------
# Workflow state, applied by hand. Declared in 12 repos, zero automation
# anywhere, zero attachments org-wide — kept under rule (2) as a complete
# ladder. See the note above.
- name: "S-Needs-Triage"
  color: "ededed"
  description: "Needs initial assessment"
- name: "S-In-Progress"
  color: "1d76db"
  description: "Actively being worked on"
- name: "S-Needs-Review"
  color: "fbca04"
  description: "Ready for code review"
- name: "S-Blocked"
  color: "b60205"
  description: "Blocked by external dependency or decision"
- name: "S-Ready-To-Merge"
  color: "0e8a16"
  description: "Approved and ready to be merged"

# --- Priority (P0-P3) ----------------------------------------------------------
# Live in 12-13 repos, so all four enter under rule (2). Their automation
# footprint is ONE repo — P0 and P1 are actions/stale `exempt-issue-labels`
# there — which is below the three-repo bar in rule (1); the previous revision
# implied a wider footprint than exists. P1 and P3 each carry two colours
# across the org today (d93f0b vs ededed, 0e8a16 vs ededed).
- name: "P0: critical"
  color: "b60205"
  description: "Outage or data loss - drop everything"
- name: "P1: high"
  color: "d93f0b"
  description: "Major impact - fix this sprint"
- name: "P2: medium"
  color: "fbca04"
  description: "Moderate impact - fix soon"
- name: "P3: low"
  color: "0e8a16"
  description: "Minor impact - fix when convenient"

# --- Change size (size/*) ------------------------------------------------------
# Applied by pascalgn/size-label-action, which 13 repos run: 11 pinned to
# 56b489b027932ec0cf60438a1a5f1a19c8fc71ff, 2 to the mutable tag v0.5.7 (the
# tag resolves to that same commit today — worth pinning). These six names are
# the action's `defaultSizes` buckets (0/10/30/100/500/1000 changed lines),
# read from index.js at that SHA, and no repo passes a `sizes` input, so
# exactly these six are reachable and all six are required.
# ALL SIX carry four different colours across the org today — the previous
# revision said five, which was wrong.
- name: "size/XS"
  color: "0e8a16"
  description: "Extra-small change (under 10 lines)"
- name: "size/S"
  color: "56d364"
  description: "Small change (10-29 lines)"
- name: "size/M"
  color: "fbca04"
  description: "Medium change (30-99 lines)"
- name: "size/L"
  color: "d93f0b"
  description: "Large change (100-499 lines)"
- name: "size/XL"
  color: "b60205"
  description: "Extra-large change (500-999 lines)"
- name: "size/XXL"
  color: "5c0102"
  description: "Massive change (1000+ lines) - consider splitting"

# --- Area (A-*) ----------------------------------------------------------------
# Path-derived, from .github/labeler.yml — 14 repos run actions/labeler.
# A-DevOps is a labeler rule in 10 repos and a release.yml category in 6;
# A-Build is a labeler rule in 7 (not 8). Every other A-* falls below the
# three-repo bar: A-Examples, A-Release and A-Scripts at 2 repos each, and
# A-CI, A-Config, A-Docker, A-Effect, A-Ports, A-Protos, A-Samples,
# A-Storybook, A-Templates and A-Vendor at 1. All stay repo-local.
# A-DevOps carries FIVE different colours across the org today.
- name: "A-DevOps"
  color: "1d76db"
  description: "CI/CD, workflows, actions, and git hooks"
- name: "A-Build"
  color: "5319e7"
  description: "Build configuration and toolchain"

# --- Dependency and release automation -----------------------------------------
# dependencies is a Dependabot `labels:` entry in 6 repos, a release.yml
# category in 6 and a labeler rule in 1 — 12 repos in all. github-actions is a
# Dependabot label in 5 (not 6). javascript is a Dependabot label in only 2,
# which is below the rule (1) bar; it enters under rule (2), live in 12 repos
# with two colours (f1e05a and 168700). ignore-for-release and skip-changelog
# are release.yml `exclude.labels` in 6 repos and carry four colours each.
- name: "dependencies"
  color: "0366d6"
  description: "Automated dependency updates"
- name: "github-actions"
  color: "1f6feb"
  description: "GitHub Actions dependency updates"
- name: "javascript"
  color: "f1e05a"
  description: "JavaScript/TypeScript dependency updates"
- name: "ignore-for-release"
  color: "cfd3d7"
  description: "Exclude this PR from generated release notes"
- name: "skip-changelog"
  color: "cfd3d7"
  description: "Omit this PR from the changelog"

# --- Lifecycle and triage ------------------------------------------------------
# stale is applied by actions/stale in 3 repos; pinned and security are read
# by it as exemptions in those same 3 (security is additionally a gh-aw
# create-issue label in 1). needs-triage and refactor are hard-coded in the
# duplicate-code-detector gh-aw front-matter in 12 repos (not 13); refactor is
# live in only 7 of those 12, and in 6 of the 7 it is grey ededed with no
# description, because a bot minted it rather than a config declaring it.
# agentic-workflows is live in 13 repos, ededed and undescribed in every single
# one and declared in none; it enters under rule (2) and is the clearest case
# of a bot-minted name.
- name: "needs-triage"
  color: "d876e3"
  description: "Awaiting first maintainer review"
- name: "refactor"
  color: "d4c5f9"
  description: "Refactoring opportunity raised by an agentic workflow"
- name: "agentic-workflows"
  color: "5319e7"
  description: "Raised or maintained by an agentic workflow"
- name: "stale"
  color: "795548"
  description: "No activity for 60 days - will close if it stays quiet"
- name: "pinned"
  color: "006b75"
  description: "Exempt from the stale bot"
- name: "security"
  color: "b60205"
  description: "Security-relevant; exempt from the stale bot"

# --- GitHub defaults -----------------------------------------------------------
# Created by GitHub on every new repository; live in 19 or 20 repos each. They
# cannot be prevented and delete-other-labels is false, so they are declared
# here to give them one description rather than left to drift.
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or PR already exists"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

# ---------------------------------------------------------------------------
# Known gap this file does NOT close
# ---------------------------------------------------------------------------
# Three names are referenced by automation and live in ZERO repositories, so
# the automation that names them mints a grey, undescribed label the first time
# it fires: `ci` (2 repos — Dependabot `labels:` in one, a gh-aw
# safe-outputs.create-issue label in another), `automation` (1 repo, gh-aw) and
# `roadmap` (1 repo, actions/stale `exempt-issue-labels` — an exemption that
# can never match). Declaring them here would only paper over it. The agentic
# triage workflows can still mint arbitrary names; `refactor` and
# `agentic-workflows` above are the evidence. That wants fixing before
# convergence, or the single-repo taxonomy simply regrows.

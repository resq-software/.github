#
# This repo publishes the org's reusable workflows, so it must keep its own
# `uses:` refs current for the same reason every consumer must.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # gh-aw lock files are only valid against the release that generated
      # them; bumping the action without recompiling silently desyncs them.
      # See docs/standards/01-baseline.md. The trailing * is load-bearing:
      # Dependabot names the dependency by full path.
      - dependency-name: "github/gh-aw-actions*"

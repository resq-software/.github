name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out every section —
        sparse reports delay triage. For suspected security issues, do **not**
        open a public issue; see [SECURITY.md](https://github.com/resq-software/.github/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release (or a recent `main` commit).
          required: true
        - label: This is **not** a security issue (those go to SECURITY.md).
          required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: "`resq --version` output, package version, or commit SHA."
      placeholder: "resq 0.2.7 / @resq-sw/ui@0.5.1 / abc1234"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - WSL
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw — exact error output, not a summary. Attach logs where possible.
      placeholder: |
        Ran `resq pre-commit` and got:
        ```
        Error: ...
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal sequence that triggers the bug. Prefer a copy-pasteable shell snippet.
      placeholder: |
        1. `git clone ...`
        2. `cd ...`
        3. `resq ...`
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, related issues, hypotheses — optional.

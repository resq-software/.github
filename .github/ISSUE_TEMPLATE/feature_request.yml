name: Feature request
description: Propose a new capability or a meaningful enhancement.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are evaluated against roadmap fit and maintenance cost.
        A clear problem statement beats a pre-baked solution every time.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues + discussions and this isn't a duplicate.
          required: true
        - label: This is a request, not a bug report. (If something's broken, use the bug template.)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today? Concrete example beats abstraction.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. What behavior or API would solve this? Feel free to sketch.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've tried or thought about.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Which repo is most affected?
      options:
        - crates (resq CLI / Rust libraries)
        - npm (UI components)
        - pypi (Python packages)
        - programs (Solana)
        - dotnet-sdk (.NET)
        - vcpkg (C++ libs)
        - viz (.NET visualization)
        - landing / docs
        - dev (installers + hooks)
        - Multiple / unsure
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, prior art, constraints.

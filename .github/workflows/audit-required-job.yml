#
# Weekly org-wide audit of the `required` status-check gate.
# Verifies every non-archived repo under resq-software/ has at least
# one CI workflow job that emits the `required` status context
# consumed by org ruleset `default-branch-baseline` (id 15191038).
#
# Without this job, PRs on that repo hang in "Expected — Waiting for
# status to be reported" state and are blocked from merge.
#
# If gaps are found, opens or updates a tracking issue on this repo
# with the list of missing repos and the reference fix (a terminal
# job that `needs:` all real jobs with `if: always()`).
#
# Private repos are audited only when a repo-scoped PAT is available
# as the `SYNC_TOKEN` org secret; otherwise the run falls back to
# GITHUB_TOKEN and reports unreachable private repos separately.
#
# DISCLOSURE — read this before changing any output string.
#
# This workflow runs on `resq-software/.github`, which is PUBLIC. Its step
# logs are world-readable and the tracking issue it opens is a PUBLIC issue.
# Every repo name, default-branch name and finding it interpolates is
# therefore published.
#
# Until now that leaked nothing only by accident: GITHUB_TOKEN cannot see
# non-public repos, so the lists came back public-only. The moment a broader
# token (`SYNC_TOKEN`, or the `ORG_READ_TOKEN` the conformance sweep asks
# for) is granted to this repository, the same code would begin publishing
# non-public repository names and their default branches into a public issue.
#
# The report is therefore two-tiered, split on the `private` flag from the
# org enumeration:
#   * public repositories    — full detail; every fact is already public.
#   * non-public repositories — counts only. No name, no branch name.
# The split is structural, not cosmetic: a non-public repo's name is never
# written into `gap_list`, `unreachable_list` or `exempt_list` at all, so no
# format string downstream can carry it into the log or the issue body.
# This includes the ruleset `exclude` list, which today already contains a
# non-public repository name and must not be echoed raw.

name: audit-required-job

on:
  schedule:
    # Monday 08:00 UTC (03:00-04:00 US Eastern, DST-dependent)
    - cron: '0 8 * * MON'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: audit-required-job
  cancel-in-progress: false

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORG: resq-software
      RULESET_ID: "15191038"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit

      - name: Scan org for missing `required` job
        id: scan
        env:
          # Prefer an org-scoped PAT (e.g. SYNC_TOKEN) for private-repo access;
          # fall back to GITHUB_TOKEN (public repos) if it's absent OR rejected
          # (e.g. the org forbids classic PATs with lifetime > 90 days).
          PRIMARY_TOKEN: ${{ secrets.SYNC_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Pick a token that actually works for org reads. A set-but-invalid
          # SYNC_TOKEN (expired, or a classic PAT the org now forbids) must NOT
          # hard-fail the audit — degrade to GITHUB_TOKEN (public-repo coverage)
          # and let private repos fall through to the unreachable list below.
          export GH_TOKEN="${PRIMARY_TOKEN:-$FALLBACK_TOKEN}"
          if [ -n "${PRIMARY_TOKEN:-}" ] && ! gh api "/orgs/$ORG/repos?per_page=1&type=all" >/dev/null 2>&1; then
            echo "::warning::SYNC_TOKEN is set but rejected (expired, or org forbids classic PATs >90d). Falling back to GITHUB_TOKEN — private repos will be reported as unreachable. Set a fine-grained SYNC_TOKEN to restore full coverage."
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi

          # ---- ONE MECHANISM FOR A FAILED READ -------------------------------
          # Same contract as the `gh_read` in org-conformance-sweep.yml, and
          # deliberately DUPLICATED rather than extracted into a shared file.
          # The tradeoff, made on purpose: a shared helper file committed
          # to this repository is unreachable from either workflow today,
          # because NEITHER checks the repository out — both talk to the
          # API only. Sharing it would mean adding `actions/checkout` to
          # both, including to the sweep, which currently works, and
          # coupling two independently scheduled jobs to a third file
          # whose regression takes out both at once. The price of the copy
          # is that a change has to be made twice. That price is paid down
          # by copying the RUNTIME SELF-TEST with it: if gh's error format
          # ever changes, BOTH workflows fail loudly on their next run,
          # instead of one of them quietly drifting into reading every 403
          # as "absent" — which is to say, as clean.
          #
          #   rc 0  the call succeeded; the body is on stdout
          #   rc 1  HTTP 404 — the resource is genuinely ABSENT. The only
          #         failure a caller is allowed to treat as information.
          #   rc 2  anything else (403, 5xx, rate limit, transport, an
          #         unparseable response). NOTHING is known.
          #
          # Used as `if v=$(gh_read ...)`, so a call site that forgets to
          # branch aborts the step under `set -e` rather than degrading into a
          # silent empty string. The status crosses the command-substitution
          # subshell through a file: a subshell's variable assignments do not
          # survive it.
          GH_STF="$RUNNER_TEMP/gh.st"
          : > "$GH_STF"
          gh_read() {
            local out err st
            if out=$(gh api "$@" 2>"$RUNNER_TEMP/gh.err"); then
              printf '%s' "$out"
              printf '0\t\n' > "$GH_STF"
              return 0
            fi
            err=$(tr -d '\r' < "$RUNNER_TEMP/gh.err" | tr '\n' ' ' \
                  | sed 's/  */ /g; s/^ //; s/ $//' | cut -c1-160)
            # `gh` reports HTTP failures as `gh: <message> (HTTP NNN)`. A jq or
            # transport failure carries no such suffix and is treated as
            # "unknown status", which classifies as rc 2 — the safe side.
            st=$(printf '%s' "$err" | sed -n 's/.*(HTTP \([0-9][0-9]*\)).*/\1/p')
            printf '%s\t%s\n' "${st:-none}" "$err" > "$GH_STF"
            if [ "$st" = 404 ]; then return 1; fi
            return 2
          }
          # Public-SAFE reason: the HTTP status alone. Never gh's message,
          # which is echoed for public repositories only.
          gh_why()    { printf 'HTTP %s' "$(cut -f1 "$GH_STF")"; }
          gh_detail() { cut -f2 "$GH_STF"; }
          # `(HTTP NNN)` is gh's output format, not a contract. If it changes,
          # every 403 below reclassifies as a 404 — as "absent", as clean. One
          # throwaway call proves the matcher still matches. A repository name
          # that cannot exist: `..` is outside the legal name character class.
          gh_selftest_rc=0
          gh_read "/repos/$ORG/this..repo..cannot..exist" --jq '.name' >/dev/null \
            || gh_selftest_rc=$?
          gh_selftest_st=$(cut -f1 "$GH_STF")
          if [ "$gh_selftest_rc" -ne 1 ] || [ "$gh_selftest_st" != 404 ]; then
            echo "::error title=audit-required-job::gh_read self-test: expected rc=1 status=404 for an impossible repository, got rc=$gh_selftest_rc status=$gh_selftest_st. gh's error format has changed, so this job can no longer tell 'absent' from 'unreadable' — and would publish every unreadable repository as a governance GAP while still claiming complete coverage. Refusing to run."
            exit 1
          fi
          echo "audit: gh_read classifier OK (impossible repo -> rc=1/HTTP 404; every other failure classifies as unreadable)"

          # Enumerate FIRST, carrying the visibility flag. Everything below
          # needs the public/non-public split before it prints anything, the
          # ruleset exclude list included.
          repo_rows=$(gh api --paginate "/orgs/$ORG/repos?type=all&per_page=100" \
            --jq '.[] | select(.archived == false)
                      | [.name, (if .private then "private" else "public" end)] | @tsv')

          is_public() {
            printf '%s\n' "$repo_rows" | awk -F'\t' -v r="$1" '$1==r && $2=="public"{f=1} END{exit !f}'
          }

          # ---- COVERAGE -----------------------------------------------------
          # The two-tier split removed the old
          #   "## Repos unreachable by the audit runner (likely private; set
          #    SYNC_TOKEN for full coverage)"
          # heading, which was this workflow's ONLY partial-coverage hint. With
          # it gone, a public-only token simply enumerates nothing non-public,
          # every counter reads 0, and the PUBLIC issue renders as a clean
          # audit of an org it never finished reading — the exact false-clean
          # pattern this change exists to kill, reintroduced one layer down.
          #
          # So coverage is measured explicitly here and stated explicitly in
          # the issue body, as counts with no names.
          #
          # `public_repos` is a public field on the org object. Archived repos
          # are excluded from the audit but INCLUDED in that count, so the
          # comparison is made against the unfiltered enumeration.
          #
          # `total_private_repos` sits in the owner-only block of the org
          # object, next to `plan` and `disk_usage`. WHAT GATES IT WAS NOT
          # ESTABLISHED. An earlier revision of this comment asserted it is
          # "an organization-ADMINISTRATION field, not a membership field";
          # nobody verified that, and the one measurement available refutes
          # the scope half of it. Measured 2026-09-29 against this org:
          #
          #   token                       scopes                    field
          #   non-member user             repo, read:org            ABSENT
          #   non-member user             repo, read:org            ABSENT
          #   org OWNER, no admin:org     repo, read:org            PRESENT
          #   org OWNER, with admin:org   admin:org, repo, ...      PRESENT
          #
          # So it is NOT the `admin:org` OAuth scope that exposes it: a
          # read:org token belonging to an org owner sees it. Whether the
          # discriminator is plain org membership or owner-level privilege
          # could not be separated, because no non-owner member token was
          # available; nor was any fine-grained token, so the remediation
          # advice below (add "Organization administration: Read") is
          # UNTESTED here and stated as advice, not as a proven mapping.
          #
          # What that uncertainty means operationally is the only thing this
          # code depends on, and it is established: the field is readable
          # under some tokens and absent under others, so its absence is
          # reported as UNVERIFIED rather than treated as a failure or,
          # worse, as a pass.
          all_rows=$(gh api --paginate "/orgs/$ORG/repos?type=all&per_page=100" \
            --jq '.[] | (if .private then "private" else "public" end)')
          # N-D: TWO DIFFERENT POPULATIONS, AND THE ISSUE NAMED THE WRONG ONE.
          # `all_rows` is deliberately UNFILTERED by archive status, because
          # `public_repos` on the org object counts archived repositories and
          # the completeness arithmetic has to compare like with like. The
          # per-repo read loop, however, iterates `repo_rows`, which IS
          # filtered. So `enum_pub + enum_priv` is the count of ALL
          # repositories, and rendering it as "All N non-archived
          # repositories were enumerated and read" was wrong twice over: they
          # are not all non-archived, and the archived ones were not read.
          # Today the org has zero archived repositories, so the two numbers
          # coincide and the defect is latent; that is not a reason to
          # publish a sentence that is false the moment one is archived.
          # Both counts are published, each described as what it is.
          scanned=$(printf '%s\n' "$repo_rows" | grep -c . || true)
          enum_pub=$(printf  '%s\n' "$all_rows" | grep -cx public  || true)
          enum_priv=$(printf '%s\n' "$all_rows" | grep -cx private || true)
          dec_pub=$(gh api "/orgs/$ORG"  --jq '.public_repos        // "null"' 2>/dev/null || echo null)
          dec_priv=$(gh api "/orgs/$ORG" --jq '.total_private_repos // "null"' 2>/dev/null || echo null)

          # ---- COVERAGE STATE: AN EXPLICIT LATTICE ---------------------------
          # This used to be a chain of plain assignments, and the last writer
          # won. Reproduced at 86ce0439e: an enumeration 3 public repos short
          # WITH a readable non-public side set PARTIAL, and the `else` branch
          # below then overwrote it with UNVERIFIED — so a measured shortfall
          # was published as "we merely could not verify the non-public side".
          # A false-clean inside the anti-false-clean fix.
          #
          # The states are therefore ranked, and an observation may only RAISE
          # the state, never lower it. PRECEDENCE, weakest to strongest:
          #
          #   rank  state       meaning
          #   ----  ----------  ---------------------------------------------
          #     0   complete    every declared repo was enumerated AND read
          #     1   UNVERIFIED  no shortfall measured, but a declared count
          #                     was unreadable, so the ABSENCE of a shortfall
          #                     could not be established either
          #     2   PARTIAL     a shortfall was measured, or an enumerated
          #                     repo failed to read — coverage is known short
          #
          # Consequences, which are the whole point of writing it down:
          #   * PARTIAL dominates UNVERIFIED       (the N1 regression)
          #   * UNVERIFIED never overwrites PARTIAL
          #   * complete never overwrites either — nothing downgrades
          #   * an unrecognised state ranks 2, so a future typo fails loud
          #     rather than reading as a pass
          cov_rank() {
            case "$1" in
              complete)   printf '%s' 0 ;;
              UNVERIFIED) printf '%s' 1 ;;
              PARTIAL)    printf '%s' 2 ;;
              *)          printf '%s' 2 ;;
            esac
          }
          cov_state=complete
          cov_raise() {
            if [ "$(cov_rank "$1")" -gt "$(cov_rank "$cov_state")" ]; then
              cov_state="$1"
            fi
          }

          # TWO QUANTITIES, TWO COUNTERS. An earlier revision added both into a
          # single `cov_unreadable`, and the public issue then had to describe
          # the mixed total as one kind of failure — so it made two false
          # statements: it attributed the whole total to "enumerated and then
          # failed to read", and it said all of them "appear in no list and no
          # count below" when the read failures are precisely the ones that DO
          # appear in the unreachable list and the non-public unreachable
          # count. They are different failures with different causes and
          # different fixes, so they are counted and reported separately:
          #
          #   cov_shortfall  DECLARED MINUS ENUMERATED. Never enumerated, so
          #                  named nowhere below — not even as a row. Cause:
          #                  the token cannot see them at all. Fix: a broader
          #                  token.
          #   cov_readfail   ENUMERATED, THEN THE READ FAILED. These DO appear
          #                  below, in the unreachable list (public) or in the
          #                  non-public unreachable count. Cause: per-repo, and
          #                  often transient — a rate limit, a 5xx, or a repo
          #                  the token may list but not read.
          cov_shortfall=0
          cov_readfail=0
          # Set when the shortfall is known to exist but is NOT MEASURABLE, so
          # that `shortfall=0` is never published next to state=PARTIAL. See
          # the public-only-token branch below.
          cov_unreadable_unknown=0

          if [ "$dec_pub" = null ]; then
            # `public_repos` is a PUBLIC field on the org object and is always
            # readable by a working token, so `null` here means the read
            # FAILED — and the public side of the arithmetic below did not
            # run. Silently skipping it leaves `complete` standing on one
            # side's evidence, which is the same false-clean shape as every
            # other defect this file has been through. Raise the state.
            echo "::warning::/orgs/$ORG did not return .public_repos, so the PUBLIC side of the coverage arithmetic did not run on this audit. Coverage cannot be reported complete."
            cov_raise UNVERIFIED
          elif [ "$enum_pub" -lt "$dec_pub" ]; then
            cov_shortfall=$(( cov_shortfall + dec_pub - enum_pub ))
            cov_raise PARTIAL
          fi
          if [ "$dec_priv" != null ]; then
            if [ "$enum_priv" -lt "$dec_priv" ]; then
              cov_shortfall=$(( cov_shortfall + dec_priv - enum_priv ))
              cov_raise PARTIAL
            fi
          elif [ "$enum_priv" -eq 0 ]; then
            # Nothing non-public enumerated AND no declared count to check it
            # against: this is the public-only-token case — the exact
            # 2026-09-28 configuration that motivated this change. Treat it as
            # partial, because it is, and say so rather than publishing a
            # clean table.
            #
            # But the shortfall CANNOT be counted here: there is no declared
            # non-public count to subtract the (zero) enumeration from. An
            # earlier revision therefore published "state=PARTIAL,
            # unreadable=0", which reads as "partial by zero repositories" —
            # self-contradictory, and reassuring in exactly the wrong
            # direction. Record it as unknown-but-nonzero instead: the whole
            # non-public side of the org was not read, whatever its size.
            cov_raise PARTIAL
            cov_unreadable_unknown=1
          else
            cov_raise UNVERIFIED
          fi
          echo "coverage (preliminary, before the per-repo reads below): state=$cov_state enumerated=$enum_pub public + $enum_priv non-public; declared=$dec_pub + $dec_priv; never-enumerated=$cov_shortfall enumerated-but-unreadable=$cov_readfail unknown-shortfall=$cov_unreadable_unknown (names withheld — this log is public)"

          # Ruleset endpoint requires admin:org scope. If the available
          # token (GITHUB_TOKEN by default) can't read it, degrade
          # gracefully: treat the exclude list as empty. Informational;
          # does not change gap detection for repos that are actually
          # governed.
          if excluded=$(gh api "/orgs/$ORG/rulesets/$RULESET_ID" \
               --jq '.conditions.repository_name.exclude // [] | join(" ")' 2>/dev/null); then
            # NEVER echo this list raw. It is org ruleset configuration and it
            # currently names a non-public repository; this log is public.
            # Print only entries confirmed public by the enumeration above. An
            # entry that is not a known public repo is counted, not named — it
            # is either non-public or stale, and both are disclosures.
            excl_public=""
            excl_withheld=0
            for e in $excluded; do
              if is_public "$e"; then
                excl_public="${excl_public}${e} "
              else
                excl_withheld=$((excl_withheld + 1))
              fi
            done
            echo "exempted-by-ruleset (public): ${excl_public:-<none>}"
            echo "exempted-by-ruleset (non-public or not enumerated): $excl_withheld (names withheld — this log is public)"
          else
            excluded=""
            echo "::warning::Could not read /orgs/$ORG/rulesets/$RULESET_ID — assuming exclude list is empty. Set SYNC_TOKEN (with admin:org scope) at the org or repo level for authoritative results."
          fi

          # Tier 1: public detail. Tier 2: counters only.
          gap_list=""
          unreachable_list=""
          exempt_list=""
          ok_count=0
          gap_count=0
          np_gap=0
          np_unreachable=0
          np_exempt=0
          np_ok=0

          # A READ FAILED, SO THE QUESTION WAS NOT ANSWERED. This outcome did
          # not exist before. The two per-repo reads below were
          #   gh api ... 2>/dev/null | grep -E '\.ya?ml$' || true
          #   gh api ... --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true
          # which put the failure on the LEFT of a pipe, where `pipefail`
          # reports the pipeline's success, so an unreadable workflow
          # directory produced the same empty string as a repository that
          # genuinely has none.
          #
          # An earlier round declined to fix this on the reasoning that the
          # failure mode "errs toward OVER-reporting" — an unreadable listing
          # makes `has_required=no`, which registers a GAP. That reasoning is
          # wrong, and reproduced as wrong against head b93616ec: with HTTP
          # 403 injected on ONE public repository's workflow listing and
          # everything else working, the run printed `gaps=1` naming a
          # repository that in fact HAS a `required` job, AND
          # `coverage (FINAL): state=complete ... enumerated-but-unreadable=0`
          # — and its output was BYTE-IDENTICAL to the same injection made as
          # a 404, which is the genuinely-empty case. So the cost is a false
          # GAP published by name in a public issue, paired with a false claim
          # that the audit was complete. Two false statements, not an
          # over-report.
          #
          # It is therefore neither a gap nor an ok: counted here, rendered in
          # the issue, annotated on the job, and it RAISES the coverage state
          # so the run cannot claim `complete`.
          #
          # Counted separately from `cov_readfail` for the reason that counter
          # is itself separate from `cov_shortfall`: they are different
          # failures that appear in different places. `cov_readfail` repos
          # appear under *unreachable*; these appear under *not assessed*, and
          # the sentence rendered for each says where to find it.
          unassessed=0
          np_unassessed=0
          unassessed_list=""
          # $1 repo  $2 visibility  $3 what did not run  $4 public-SAFE why
          # $5 public-only detail (optional)
          # `$4` is passed in rather than read from `gh_why` inside, because
          # not every unassessed outcome has an HTTP status — a body that
          # decodes to nothing came back 200 — and inheriting the last status
          # would attribute it to an unrelated request.
          note_unassessed() {
            local r="$1" vis="$2" chk="$3" why="$4" detail="${5:-}"
            unassessed=$((unassessed + 1))
            cov_raise PARTIAL
            if [ "$vis" = public ]; then
              unassessed_list="${unassessed_list}- $r — $chk ($why${detail:+; $detail})"$'\n'
              echo "::warning title=audit-required-job::$r — NOT ASSESSED: $chk — $why${detail:+: $detail}"
            else
              # Tier 2. The label and the HTTP status carry no name; the
              # repository name and gh's message are never written here.
              np_unassessed=$((np_unassessed + 1))
              echo "::warning title=audit-required-job::a non-public repository — NOT ASSESSED: $chk — $why (repository name and gh message withheld — this log is public)"
            fi
          }

          # Fed by process substitution, NOT a pipe: a pipe would run this loop
          # in a subshell and silently discard every counter increment below.
          while IFS=$'\t' read -r repo vis; do
            [ -n "$repo" ] || continue

            default=$(gh api "/repos/$ORG/$repo" --jq '.default_branch' 2>/dev/null || echo "")
            if [ -z "$default" ]; then
              # Enumerated but not readable. Either way this is partial
              # coverage, whichever tier it falls in. Counted apart from the
              # never-enumerated shortfall: this repo IS listed below, in the
              # unreachable list or the non-public unreachable count, so the
              # issue must not claim it "appears in no list".
              cov_readfail=$((cov_readfail + 1))
              cov_raise PARTIAL
              if [ "$vis" = public ]; then
                unreachable_list="${unreachable_list}- $repo"$'\n'
              else
                np_unreachable=$((np_unreachable + 1))
              fi
              continue
            fi

            # THREE OUTCOMES, NOT TWO. rc 1 (404) means the repository has
            # no `.github/workflows` directory at all — genuine information,
            # and a repository with no workflows genuinely has no `required`
            # job, so the gap classification below is correct for it. rc 2
            # means the listing could not be read and NOTHING follows from it,
            # least of all a gap.
            # The `.ya?ml$` filter is applied by jq rather than by a
            # downstream `grep ... || true`, so that the only thing left of a
            # pipe here is nothing at all: that `|| true` is precisely the
            # shape that made a failed read indistinguishable from an empty
            # directory in the first place.
            files=""
            if ls_out=$(gh_read "/repos/$ORG/$repo/contents/.github/workflows?ref=$default" \
                          --jq '[.[] | .name | select(test("\\.ya?ml$"))] | join(" ")'); then
              files="$ls_out"
            elif [ "$?" -eq 2 ]; then
              note_unassessed "$repo" "$vis" "workflow directory listing — the \`required\` job could not be looked for" "$(gh_why)" "$(gh_detail)"
              continue
            fi

            has_required=no
            unread_file=no
            unread_why=""
            unread_detail=""
            for f in $files; do
              # This file was just LISTED. A 404 now is a race with a push and
              # a 403/5xx is an access failure; neither is evidence that this
              # file carries no `required` job, so neither may contribute to a
              # `no` verdict. Both are recorded and the verdict is withheld
              # below.
              if content_b64=$(gh_read "/repos/$ORG/$repo/contents/.github/workflows/$f?ref=$default" \
                                 --jq '.content'); then
                content=$(printf '%s' "$content_b64" | base64 -d 2>/dev/null || true)
                if [ -z "$content" ]; then
                  # Read fine (HTTP 200) and decoded to nothing: an empty
                  # file, or an entry with no `.content` at all (a submodule
                  # or symlink). Not absent, and not assessable either — the
                  # same third outcome `check_run_health` records in
                  # org-conformance-sweep.yml, given the same treatment here.
                  unread_file=yes
                  [ -n "$unread_why" ] || unread_why="read succeeded, body decoded empty"
                  continue
                fi
              else
                unread_file=yes
                # First failure wins: a later one would overwrite a status the
                # reader is being given as the reason.
                if [ -z "$unread_why" ]; then
                  unread_why="$(gh_why)"
                  unread_detail="$(gh_detail)"
                fi
                continue
              fi

              # Skip workflows that only trigger on workflow_call (reusables).
              # A reusable workflow never fires on pull_request even if it has
              # a job named `required`, so matching one would false-green.
              on_block=$(printf '%s\n' "$content" | awk '/^on:/{flag=1; next} flag && /^[a-zA-Z]/{flag=0} flag')
              if ! printf '%s\n' "$on_block" | grep -Eq '^[[:space:]]*(pull_request|push):'; then
                continue
              fi

              # Match either top-level `required:` job key or `name: required`.
              if printf '%s\n' "$content" | grep -Eq '^  required:[[:space:]]*$|^    name:[[:space:]]*"?required"?[[:space:]]*$'; then
                has_required=yes
                break
              fi
            done

            # A POSITIVE find is conclusive even if a sibling file could not
            # be read: the `required` job was actually seen. A NEGATIVE
            # verdict is not, because the file that could not be read may be
            # the one carrying it. Only the negative verdict is withheld.
            if [ "$has_required" = yes ]; then
              ok_count=$((ok_count + 1))
              [ "$vis" = public ] || np_ok=$((np_ok + 1))
              continue
            fi
            if [ "$unread_file" = yes ]; then
              note_unassessed "$repo" "$vis" "\`required\` job — no workflow that was read carries one, but at least one workflow file could not be read" "$unread_why" "$unread_detail"
              continue
            fi

            is_exempt=no
            for e in $excluded; do
              if [ "$e" = "$repo" ]; then is_exempt=yes; break; fi
            done
            if [ "$is_exempt" = yes ]; then
              if [ "$vis" = public ]; then
                exempt_list="${exempt_list}- $repo"$'\n'
              else
                np_exempt=$((np_exempt + 1))
              fi
              continue
            fi

            gap_count=$((gap_count + 1))
            if [ "$vis" = public ]; then
              # The default-branch name is published here. That is fine for a
              # public repo and is never reached for a non-public one.
              gap_list="${gap_list}- $repo (branch=\`$default\`)"$'\n'
            else
              np_gap=$((np_gap + 1))
            fi
          done < <(printf '%s\n' "$repo_rows")

          # N7: the preliminary line above is printed BEFORE the per-repo loop,
          # which can still raise the state and the unreadable count. Printing
          # it only there let this PUBLIC step log say `state=complete` while
          # the PUBLIC issue it then opened said PARTIAL. This one is emitted
          # after every writer has run and is the authoritative one.
          echo "coverage (FINAL): state=$cov_state never-enumerated=$cov_shortfall enumerated-but-unreadable=$cov_readfail unknown-shortfall=$cov_unreadable_unknown (names withheld — this log is public)"
          echo "summary: ok=$ok_count  gaps=$gap_count  public-gaps=$((gap_count - np_gap))  non-public-gaps=$np_gap  unreachable-non-public=$np_unreachable"
          echo "not-assessed: $unassessed repositories whose \`required\`-job question a failed read left unanswered ($np_unassessed non-public) — neither a gap nor a pass (names withheld — this log is public)"

          {
            echo "gap_count=$gap_count"
            echo "np_gap=$np_gap"
            echo "np_unreachable=$np_unreachable"
            echo "np_exempt=$np_exempt"
            echo "np_ok=$np_ok"
            echo "cov_state=$cov_state"
            echo "cov_shortfall=$cov_shortfall"
            echo "cov_readfail=$cov_readfail"
            echo "unassessed=$unassessed"
            echo "np_unassessed=$np_unassessed"
            echo "cov_unreadable_unknown=$cov_unreadable_unknown"
            echo "cov_enum=$((enum_pub + enum_priv))"
            echo "cov_scanned=$scanned"
            echo "gap_list<<GAPEOF"
            printf '%s' "${gap_list:-*(none)*
          }"
            echo "GAPEOF"
            echo "unreachable_list<<UNREOF"
            printf '%s' "${unreachable_list:-*(none)*
          }"
            echo "UNREOF"
            echo "exempt_list<<EXEOF"
            printf '%s' "${exempt_list:-*(none)*
          }"
            echo "EXEOF"
            echo "unassessed_list<<UNASEOF"
            printf '%s' "${unassessed_list:-*(none)*
          }"
            echo "UNASEOF"
          } >> "$GITHUB_OUTPUT"

      # N8: this used to be gated on `gap_count != '0'` alone, so the coverage
      # note — the one thing standing between a partial audit and a report
      # that reads clean — only ever reached a reader when there happened to
      # also be a gap. With partial coverage and zero gaps, nothing was
      # created and nothing was commented, and the only trace of an audit that
      # did not finish was a line in a step log nobody reads. Incomplete
      # coverage is now reportable on its own, independent of gaps.
      - name: Upsert tracking issue on gaps or incomplete coverage
        if: ${{ steps.scan.outputs.gap_count != '0' || steps.scan.outputs.cov_state != 'complete' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GAP_COUNT: ${{ steps.scan.outputs.gap_count }}
          COV_UNREADABLE_UNKNOWN: ${{ steps.scan.outputs.cov_unreadable_unknown }}
          GAP_LIST: ${{ steps.scan.outputs.gap_list }}
          UNREACHABLE_LIST: ${{ steps.scan.outputs.unreachable_list }}
          EXEMPT_LIST: ${{ steps.scan.outputs.exempt_list }}
          NP_GAP: ${{ steps.scan.outputs.np_gap }}
          NP_UNREACHABLE: ${{ steps.scan.outputs.np_unreachable }}
          NP_EXEMPT: ${{ steps.scan.outputs.np_exempt }}
          COV_STATE: ${{ steps.scan.outputs.cov_state }}
          COV_SHORTFALL: ${{ steps.scan.outputs.cov_shortfall }}
          COV_READFAIL: ${{ steps.scan.outputs.cov_readfail }}
          UNASSESSED: ${{ steps.scan.outputs.unassessed }}
          NP_UNASSESSED: ${{ steps.scan.outputs.np_unassessed }}
          UNASSESSED_LIST: ${{ steps.scan.outputs.unassessed_list }}
          COV_ENUM: ${{ steps.scan.outputs.cov_enum }}
          COV_SCANNED: ${{ steps.scan.outputs.cov_scanned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'chore(governance): required-job audit — missing `required` status-check gates and audit coverage'
        shell: bash
        run: |
          set -euo pipefail

          # This issue is created on a PUBLIC repository. Only the tier-1
          # (public-repo) lists are interpolated; non-public repositories
          # appear as counts, which is all the scan step recorded for them.
          #
          # The coverage block is NOT optional decoration. It replaces the
          # "(likely private; set SYNC_TOKEN for full coverage)" heading that
          # the two-tier split removed, and it is the only thing standing
          # between a partial audit and an issue that reads clean. Counts
          # only — no names, no branch names.
          #
          # TWO KINDS OF MISSING REPOSITORY, SAID SEPARATELY. An earlier
          # revision summed them into one counter and had to describe the
          # total as a single kind, which made the issue state two false
          # things: it attributed never-enumerated repositories to a read
          # failure, and it said they all "appear in no list and no count
          # below" when the read failures are exactly the ones that DO appear.
          # The two have different causes and different fixes, so they get
          # different sentences:
          #
          #   COV_SHORTFALL  declared minus enumerated. NEVER ENUMERATED, so
          #                  named nowhere below. Cause: this token cannot see
          #                  them. Fix: a broader token.
          #   COV_READFAIL   enumerated, then the read failed. ACCOUNTED FOR
          #                  BELOW — by name in the unreachable list if
          #                  public, in the non-public unreachable count
          #                  otherwise. Cause: per-repo and often transient.
          #                  Fix: usually a re-run.
          #
          # N2: in the public-only-token mode the never-enumerated shortfall
          # is real but not measurable — there is no declared non-public count
          # to subtract the zero enumeration from — so `COV_SHORTFALL` is 0
          # there. Publishing "PARTIAL, 0 unreadable" understates a whole
          # unread side of the org. Render it as unknown-but-nonzero instead.
          # N-A: REPORT EVERY COUNTER THAT HAS A VALUE. These were an
          # `if`/`elif`, so the unknown branch SUPPRESSED a shortfall that had
          # actually been measured. Driven at unknown=1, shortfall=2,
          # readfail=1, the public issue said only "an unknown, non-zero
          # number" and the measured **2** never appeared anywhere in it.
          #
          # They are not alternatives. `cov_unreadable_unknown` is set only
          # when the NON-PUBLIC declared count is unreadable, and in exactly
          # that state `cov_shortfall` can still carry a measured PUBLIC
          # shortfall. An unknown quantity and a measured one are two facts,
          # and a reader who is told only the vaguer of them is worse off
          # than one told both. Both sentences are rendered whenever both
          # hold, in the order measured-then-unknown so the issue leads with
          # the number a reader can act on.
          never_enum=""
          if [ "${COV_SHORTFALL:-0}" != 0 ]; then
            if [ "${COV_SHORTFALL}" = 1 ]; then ne_v="was"; ne_p="it was"; ne_a="appears"
            else                                ne_v="were"; ne_p="they were"; ne_a="appear"; fi
            never_enum="**${COV_SHORTFALL}** of this org's repositories $ne_v **never enumerated** — the org declares more than this token could list — so $ne_p not audited at all and $ne_a in no list and no count below."
          fi
          if [ "${COV_UNREADABLE_UNKNOWN:-0}" = 1 ]; then
            unknown_enum="**In addition, and separately from any number above**, an **unknown, non-zero** number of this org's **non-public** repositories were **never enumerated**, so they were not audited at all and appear in no list and no count below. That number cannot be given: this token enumerated **0** non-public repositories and cannot read the org's declared non-public count either, so the size of what it did not see is not measurable from inside this run."
          else
            unknown_enum=""
          fi
          if [ "${COV_READFAIL:-0}" != 0 ]; then
            if [ "${COV_READFAIL}" = 1 ]; then rf_n="repository **was**"; rf_d="it **is**"; else rf_n="repositories **were**"; rf_d="those **are**"; fi
            read_failed="Separately, **${COV_READFAIL}** $rf_n enumerated and then failed to read. Unlike the never-enumerated ones, $rf_d accounted for below — public ones by name under *unreachable*, non-public ones in the non-public unreachable count — and the cause is per-repo rather than a token gap: a rate limit, a 5xx, or a repository this token may list but not read. A re-run often clears it."
          else
            read_failed=""
          fi
          # A THIRD KIND, said separately for the same reason the first two
          # are: it appears in a different place, so a reader told only the
          # total cannot find any of them. These repositories WERE enumerated
          # and WERE read at the repository level; it is the workflow read that
          # failed, so they are in neither the gap list nor the unreachable
          # list, and calling them either would be a false statement.
          if [ "${UNASSESSED:-0}" != 0 ]; then
            if [ "${UNASSESSED}" = 1 ]; then ua_n="repository **was**"; ua_d="It is"
            else                             ua_n="repositories **were**"; ua_d="They are"; fi
            not_assessed="Separately again, **${UNASSESSED}** $ua_n enumerated and read at the repository level, but a workflow read then failed, so the \`required\`-job question was **not answered** there. $ua_d **not** listed as a gap and **not** counted as compliant — publishing either would be a claim this run cannot support. See *repositories the audit could not assess* below: public ones by name, non-public ones as a count."
          else
            not_assessed=""
          fi
          cov_detail=""
          for s in "$never_enum" "$unknown_enum" "$read_failed" "$not_assessed"; do
            [ -n "$s" ] || continue
            cov_detail="${cov_detail:+$cov_detail }$s"
          done
          # Reachable only if the state was raised by something neither
          # counter saw; say so rather than rendering an empty warning.
          [ -n "$cov_detail" ] || cov_detail="Coverage was not established as complete, and neither counter attributes it — see the \`coverage (FINAL)\` line in the run log."

          case "$COV_STATE" in
            complete)
              coverage="Coverage: **complete**. All **${COV_ENUM}** repositories the org declares were enumerated — that count is deliberately **unfiltered by archive status**, because \`public_repos\` on the org object includes archived repositories and the completeness arithmetic has to compare like with like — and the **${COV_SCANNED}** **non-archived** ones among them, which are the audit's actual scope, were each read."
              ;;
            UNVERIFIED)
              coverage="> [!NOTE]
          > **Coverage of non-public repositories is UNVERIFIED.** ${COV_ENUM} repositories were enumerated (a count that deliberately **includes archived** ones, to match \`public_repos\`) and the ${COV_SCANNED} **non-archived** ones among them — the audit's actual scope — were each read, but \`total_private_repos\` is not readable by this token, so the audit cannot prove it saw every non-public repository. That field sits in the owner-only block of the org object; what exactly gates it is **not established here** — measured against this org, it was absent for every non-member token tried and present for both org-owner tokens tried, including one without \`admin:org\` scope, so it is not the \`admin:org\` scope that exposes it. Adding **Organization administration: Read** to a fine-grained token is the suggested remedy but was **not tested**. Names are withheld: this issue is public."
              ;;
            *)
              coverage="> [!WARNING]
          > **Coverage was INCOMPLETE — do not read this issue as a clean bill of health.**
          >
          > ${cov_detail} Names are withheld: this issue is public.
          >
          > Grant a token that can read the whole org — the existing org secret \`SYNC_TOKEN\` granted to this repository, or an org-wide \`ORG_READ_TOKEN\` (fine-grained: Metadata + Contents read) — and re-run. Until then this audit is partial by construction."
              ;;
          esac

          # N8: with the step now also reachable on zero gaps, neither the
          # lead sentence nor the ruleset paragraph may assert a finding that
          # does not exist.
          if [ "${GAP_COUNT:-0}" != 0 ]; then
            lead="The weekly \`required\`-job audit detected repos without a CI job emitting the \`required\` status-check context."
            ruleset_note="These repos are governed by org ruleset \`default-branch-baseline\` (id 15191038) which requires that context. Until a \`required\` job is added, PRs will hang in \"Expected — Waiting for status to be reported\" and be blocked from merge."
          else
            lead="The weekly \`required\`-job audit found **no missing \`required\` job among the repositories whose workflows it was able to read** — but it could not read all of them. The coverage note below **is** the finding; there is nothing else in this comment."
            ruleset_note="Repositories governed by org ruleset \`default-branch-baseline\` (id 15191038) must emit that context or their PRs hang in \"Expected — Waiting for status to be reported\". Nothing below is a gap — the point of this comment is that the audit's coverage was short."
          fi

          body=$(cat <<BODYEOF
          ${lead}

          ${coverage}

          ${ruleset_note}

          ## Public repos missing the \`required\` job

          ${GAP_LIST}

          ## Public repos exempt via ruleset \`exclude\` list (informational)

          ${EXEMPT_LIST}

          ## Public repos enumerated but unreachable by the audit runner

          Listed here only if the enumeration saw them and the subsequent read failed. A repository the token cannot enumerate at all never reaches this list — that shortfall is in the coverage note above.

          ${UNREACHABLE_LIST}

          ## Public repos the audit could not assess

          The repository was read, but a workflow read then failed, so the \`required\`-job question was not answered for it. **Neither a gap nor a pass** — listed here precisely so that the outcome cannot be folded into either. A repository whose workflow directory returned HTTP 404 is not here: that is a repository with no workflows, which genuinely has no \`required\` job, and it appears above as a gap.

          ${UNASSESSED_LIST}

          ## Non-public repositories

          This issue is public, so non-public repositories are reported as counts only — no names, no branch names.

          | | count |
          | --- | --- |
          | missing the \`required\` job | ${NP_GAP} |
          | exempt via ruleset \`exclude\` | ${NP_EXEMPT} |
          | unreachable by the audit runner | ${NP_UNREACHABLE} |
          | not assessed (a workflow read failed) | ${NP_UNASSESSED} |

          If \`unreachable\` is non-zero, the audit is running without a token that can see the whole org and its coverage is partial. If \`missing\` is non-zero, the detail is deliberately not here: read it from the workflow run's own per-repo API calls, or route it to an issue on a non-public repository.

          ## Fix

          For each listed repo, append a terminal \`required\` job to the repo's main CI workflow:

          \`\`\`yaml
            required:
              name: required
              needs: [<all-real-job-names>]
              if: always()
              runs-on: ubuntu-latest
              steps:
                - env:
                    RESULTS: \${{ toJSON(needs) }}
                  run: |
                    set -eu
                    echo "\$RESULTS" | jq -r 'to_entries[] | "\\(.key)=\\(.value.result)"'
                    if echo "\$RESULTS" | jq -e 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")' >/dev/null; then
                      exit 1
                    fi
          \`\`\`

          Reference implementation: https://github.com/resq-software/npm/pull/46

          ## Alternative

          If exclusion is intentional, add the repo to the ruleset's \`conditions.repository_name.exclude\` list:

          \`\`\`sh
          gh api /orgs/resq-software/rulesets/15191038 \\
            | jq '.conditions.repository_name.exclude += ["<repo-name>"]' \\
            | gh api --method PUT /orgs/resq-software/rulesets/15191038 --input -
          \`\`\`

          ---
          Audit run: ${RUN_URL}
          BODYEOF
          )

          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "required-job audit"' \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "updated issue #$existing"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$body"
          fi

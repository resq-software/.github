#
# Reusable Python CI — uv + ruff + mypy + pytest. Callable from any
# resq-software/* repo. Pairs with security-scan.yml.
#
# Security: caller-controlled string inputs that reach `run:` are
# forwarded through `env:` and referenced as `"$VAR"`.

name: python-ci

on:
  workflow_call:
    inputs:
      python-versions:
        type: string
        required: false
        default: '["3.11","3.12","3.13"]'
      default-python:
        type: string
        required: false
        default: "3.13"
      working-directory:
        type: string
        required: false
        default: "."
      run-lint:
        type: boolean
        required: false
        default: true
      run-typecheck:
        type: boolean
        required: false
        default: true
      run-test:
        type: boolean
        required: false
        default: true
      run-build:
        type: boolean
        required: false
        default: true
      test-paths:
        description: Space-separated test paths. Empty = pytest discovers via pyproject.toml.
        type: string
        required: false
        default: ""
      test-flags:
        type: string
        required: false
        default: "-v"
      mypy-targets:
        type: string
        required: false
        default: "src/"
      ruff-targets:
        type: string
        required: false
        default: "src/ tests/"
      timeout-minutes:
        type: number
        required: false
        default: 15

permissions:
  contents: read

jobs:
  lint:
    if: ${{ inputs.run-lint }}
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: ${{ inputs.default-python }}
          enable-cache: true
      - run: uv sync
      - name: ruff check
        env:
          TARGETS: ${{ inputs.ruff-targets }}
        run: sh -c "uv run ruff check $TARGETS"
      - name: ruff format check
        env:
          TARGETS: ${{ inputs.ruff-targets }}
        run: sh -c "uv run ruff format --check $TARGETS"

  typecheck:
    if: ${{ inputs.run-typecheck }}
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: ${{ inputs.default-python }}
          enable-cache: true
      - run: uv sync
      - name: mypy
        env:
          TARGETS: ${{ inputs.mypy-targets }}
        run: sh -c "uv run mypy $TARGETS"

  test:
    if: ${{ inputs.run-test }}
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync
      - name: pytest
        env:
          PATHS: ${{ inputs.test-paths }}
          FLAGS: ${{ inputs.test-flags }}
        run: sh -c "uv run pytest $PATHS $FLAGS"

  build:
    if: ${{ inputs.run-build }}
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          python-version: ${{ inputs.default-python }}
          enable-cache: true
      - run: uv build

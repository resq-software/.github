#
# Reusable Node/TypeScript CI — supports bun (default), npm, pnpm, yarn.
# Generic; doesn't enforce a specific test framework or linter. Pairs
# with security-scan.yml. SHA-pinned actions with trailing `# <tag>`.
#
# Security: all workflow_call inputs that reach `run:` are forwarded
# through `env:` and referenced as `"$VAR"` to prevent template-time
# expansion of potentially caller-controlled strings into the shell.

name: node-ci

on:
  workflow_call:
    inputs:
      package-manager:
        description: bun | npm | pnpm | yarn.
        type: string
        required: false
        default: "bun"
      node-version:
        type: string
        required: false
        default: "22"
      bun-version:
        type: string
        required: false
        default: "latest"
      working-directory:
        type: string
        required: false
        default: "."
      cache-dependency-path:
        description: >-
          Forwarded to actions/setup-node's `cache-dependency-path`.
          Required when the lockfile lives outside the repo root
          (e.g. `src/Web/package-lock.json` in a polyglot repo).
          Default empty — setup-node falls back to repo-root detection,
          matching the prior behaviour for consumers that don't set it.
        type: string
        required: false
        default: ""
      install-cmd:
        description: Override install command. Empty = pm default.
        type: string
        required: false
        default: ""
      lint-cmd:
        type: string
        required: false
        default: ""
      typecheck-cmd:
        type: string
        required: false
        default: ""
      test-cmd:
        type: string
        required: false
        default: ""
      build-cmd:
        type: string
        required: false
        default: ""
      timeout-minutes:
        type: number
        required: false
        default: 15
      runner:
        description: >-
          Label(s) the job runs on. Defaults to GitHub-hosted
          `ubuntu-latest`; set to a self-hosted label (e.g. `self-hosted`)
          to run on an org/repo self-hosted runner instead — useful when
          GitHub-hosted minutes are exhausted. A single label string;
          callers typically wire this to a repo variable so it can be
          toggled without editing the workflow.
        type: string
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  ci:
    name: Node CI
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # pnpm MUST be installed before setup-node when cache: 'pnpm' is used,
      # because setup-node's pnpm cache detection resolves the pnpm binary.
      - if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v4
        with:
          run_install: false

      - if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # Runs for EVERY package manager, bun included. bun is the PM/runtime, but
      # native and postinstall deps (sharp, cypress, …) spawn `node` during
      # `bun install`, so a modern Node must be on PATH regardless — otherwise
      # a runner whose system `node` is old (common on self-hosted) crashes the
      # install. No npm/yarn/pnpm cache for bun; bun manages its own store.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager == 'yarn' && 'yarn' || inputs.package-manager == 'pnpm' && 'pnpm' || inputs.package-manager == 'npm' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.package-manager == 'bun' && '' || inputs.cache-dependency-path }}

      - name: Install
        env:
          PM: ${{ inputs.package-manager }}
          INSTALL_CMD: ${{ inputs.install-cmd }}
        run: |
          set -eu
          if [ -n "$INSTALL_CMD" ]; then
            sh -c "$INSTALL_CMD"
          else
            case "$PM" in
              bun)   bun install --frozen-lockfile ;;
              npm)   npm ci ;;
              pnpm)  pnpm install --frozen-lockfile ;;
              yarn)  yarn install --immutable ;;
              *)     echo "::error::Unknown package-manager: $PM" >&2; exit 2 ;;
            esac
          fi

      - if: ${{ inputs.lint-cmd != '' }}
        name: Lint
        env:
          CMD: ${{ inputs.lint-cmd }}
        run: sh -c "$CMD"

      - if: ${{ inputs.typecheck-cmd != '' }}
        name: Typecheck
        env:
          CMD: ${{ inputs.typecheck-cmd }}
        run: sh -c "$CMD"

      - if: ${{ inputs.build-cmd != '' }}
        name: Build
        env:
          CMD: ${{ inputs.build-cmd }}
        run: sh -c "$CMD"

      - if: ${{ inputs.test-cmd != '' }}
        name: Test
        env:
          CMD: ${{ inputs.test-cmd }}
        run: sh -c "$CMD"

#
# Emits the `required` status-check context consumed by org ruleset
# `default-branch-baseline` (id 15191038) on PRs and pushes to main.
#
# This repo publishes reusable workflows and doesn't have language CI
# of its own, so the gate carries only the checks that apply to a
# workflow-publishing repo: repo-standards and private-name-guard. The
# actual validation of workflow files (actionlint, zizmor, CodeQL
# actions-language, etc.) runs in security-scan.yml which is called via
# a separate caller.
#
# Without this file, every PR on resq-software/.github hangs on
# "Expected — Waiting for status to be reported" because reusable
# workflows (on: workflow_call) never fire on pull_request events.

name: required-gate

on:
  # `edited` is not a default activity type. The private-name guard's text scan
  # reads the pull request TITLE and BODY, and this file's own header notes
  # that a squash commit message is built from them -- so without `edited` a
  # title or body changed after a green verdict is never re-read, and the
  # guarantee "both are scanned on the pull request itself" does not hold. The
  # cost is a gate re-run on description edits, which is the right trade for a
  # surface that reaches the default branch verbatim.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dogfood the org template/standards check on this repo itself.
  repo-standards:
    name: Repo standards
    uses: ./.github/workflows/repo-standards.yml

  # Dogfood the private-name forward guard on this repo itself. Strict by
  # default -- that file's header explains why a hit is a true positive by
  # construction, and why a tree it could not assess fails rather than passes.
  private-name-guard:
    name: Private-name guard
    uses: ./.github/workflows/private-name-guard.yml
    with:
      # Dogfood the text scan here first. This repo is where the two historical
      # disclosures landed, and where the guard itself is developed.
      scan-text: true
    secrets:
      PRIVATE_NAME_GUARD_TOKEN: ${{ secrets.PRIVATE_NAME_GUARD_TOKEN }}

  # Exercises the `fetch-commit` path that private-name-guard-fork.yml depends
  # on. That caller only fires on fork pull requests, and this repository has
  # never received one, so without this job the fetch/unpack/scan/read-commit-
  # messages-over-the-API mechanism would first run in anger on a contributor's
  # pull request. Here it runs on every pull request, against that pull
  # request's own head commit, so a regression surfaces on our own changes.
  #
  # Deliberately NOT in `required`'s needs below. The fork check this backs is
  # itself advisory, and gating this repository on the path would be a stricter
  # promise than the thing the path serves.
  #
  # Skipped on forks: a fork `pull_request` has no secret, so this job would
  # fail for the same reason the gate's own guard job does, and the fork caller
  # is what covers that case.
  private-name-guard-fetch:
    name: Private-name guard (fetch mode)
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.head.repo.fork
    uses: ./.github/workflows/private-name-guard.yml
    with:
      fetch-commit: ${{ github.event.pull_request.head.sha }}
      scan-text: true
    secrets:
      PRIVATE_NAME_GUARD_TOKEN: ${{ secrets.PRIVATE_NAME_GUARD_TOKEN }}

  required:
    name: required
    needs: [repo-standards, private-name-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2
        with:
          egress-policy: audit
      - name: Evaluate upstream results
        env:
          REPO_STANDARDS_RESULT: ${{ needs.repo-standards.result }}
          PRIVATE_NAME_GUARD_RESULT: ${{ needs.private-name-guard.result }}
        run: |
          set -eu
          case "$REPO_STANDARDS_RESULT" in
            success|skipped|"") echo "ok — .github repo has no language CI to gate on" ;;
            *) echo "::error::repo-standards returned: $REPO_STANDARDS_RESULT"; exit 1 ;;
          esac
          # Unlike repo-standards above, `skipped` and empty are NOT accepted
          # here. The guard exists to stop a private repo name reaching a
          # public tree, and "it did not run" is not evidence that none did.
          # Accepting silence here would reintroduce exactly the false
          # assurance the guard was written to remove.
          case "$PRIVATE_NAME_GUARD_RESULT" in
            success) echo "ok — no private repository name in this tree" ;;
            *) echo "::error::private-name-guard returned: ${PRIVATE_NAME_GUARD_RESULT:-<empty>} — a tree that was not assessed is not a clean tree"; exit 1 ;;
          esac

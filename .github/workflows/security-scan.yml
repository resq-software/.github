#
# Reusable security scan — callable from any resq-software/* repo with a
# thin wrapper (see .github/workflows/README.md).
#
# Defense-in-depth layers:
#   harden-runner       Audit/block runner egress (defense vs hijacked actions)
#   codeql              SAST per language
#   gitleaks            Git history secret scan (MIT CLI, pinned + checksummed)
#   osv-scanner         Dependency vulnerability scan (Google OSV)
#   dependency-review   PR-only; blocks high-severity CVEs
#   snyk                Opt-in; requires SNYK_TOKEN
#   zizmor              Static audit of workflow YAML for security anti-patterns
#   actionlint          Workflow YAML correctness lint
#   semgrep             Opt-in SAST; requires SEMGREP_APP_TOKEN
#
# All third-party `uses:` refs are SHA-pinned with a trailing `# <tag>`
# comment so Dependabot can still propose updates.

name: security-scan

on:
  workflow_call:
    inputs:
      languages:
        description: >
          JSON array of CodeQL languages (e.g. '["python","javascript-typescript"]').
          Pass an empty array '[]' or omit to skip CodeQL.
          Valid members: actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift.
        type: string
        required: false
        default: "[]"
      enable-gitleaks:
        description: >
          Full git-history secret scan using the MIT gitleaks CLI, pinned by
          version and verified by checksum. Needs no licence key. Off by
          default — GitHub's native secret scanning covers repositories that
          have it enabled. Assumes a Linux x86-64 runner; a caller pointing
          `runner` at an arm64 or macOS label must change the pinned asset.
        type: boolean
        required: false
        default: false
      enable-osv:
        type: boolean
        required: false
        default: true
      enable-dependency-review:
        type: boolean
        required: false
        default: true
      enable-snyk:
        description: Requires SNYK_TOKEN repo secret.
        type: boolean
        required: false
        default: false
      enable-semgrep:
        description: Requires SEMGREP_APP_TOKEN repo secret.
        type: boolean
        required: false
        default: false
      enable-zizmor:
        type: boolean
        required: false
        default: true
      enable-actionlint:
        type: boolean
        required: false
        default: true
      enable-vet:
        description: >
          Run safedep/vet OSS dependency policy scan against the caller repo's
          .github/vet/policy.yml + .github/vet/exceptions.yml. Off by default;
          soft-launch (non-blocking) until exceptions are seeded.
        type: boolean
        required: false
        default: false
      submodules:
        description: >
          Checkout submodules for the CodeQL job (autobuild may need them).
          Pass 'true' for top-level, 'recursive' for nested, or '' to skip.
        type: string
        required: false
        default: ""
      runner:
        description: >-
          Label(s) the scan jobs run on. Defaults to GitHub-hosted
          `ubuntu-latest`; set to a self-hosted label (e.g. `self-hosted`)
          to run on an org/repo self-hosted runner instead — useful when
          GitHub-hosted minutes are exhausted. A single label string;
          callers typically wire this to a repo variable so it can be
          toggled without editing the workflow. Mirrors node-ci.yml's
          `runner` input.
        type: string
        required: false
        default: "ubuntu-latest"

    # Declared so callers can forward these by name instead of `secrets:
    # inherit` (which hands this workflow ALL of the caller's secrets and
    # trips zizmor's `secrets-inherit` audit). All optional, each gated by
    # its matching `enable-*` input, so omitting one is a no-op.
    secrets:
      GITLEAKS_LICENSE:
        description: >
          DEPRECATED — unused since the gitleaks job moved to the MIT CLI,
          which requires no licence key. Kept declared so existing callers
          that still pass it do not error; removing it is a breaking change
          and a separate PR.
        required: false
      SEMGREP_APP_TOKEN:
        description: Semgrep App token. Used only when enable-semgrep is true.
        required: false
      SNYK_TOKEN:
        description: Snyk token. Used only when enable-snyk is true.
        required: false
      SAFEDEP_CLOUD_KEY:
        description: SafeDep Cloud API key (optional; malware/zero-day analysis). Used only when enable-vet is true.
        required: false
      SAFEDEP_CLOUD_TENANT:
        description: SafeDep Cloud tenant. Used only when enable-vet is true.
        required: false

permissions:
  contents: read
  security-events: write   # CodeQL + SARIF uploads
  pull-requests: read      # dependency-review

jobs:
  # ── safedep/vet — OSS Dependency Policy ───────────────────────────────────
  # Malware (MAL-), critical/high vulns, license allowlist (npm/PyPI/NuGet),
  # OpenSSF Scorecard maintenance/dangerous-workflow, popularity floor — gated
  # by the caller's .github/vet/policy.yml. Soft-launch: non-blocking until the
  # caller seeds .github/vet/exceptions.yml and promotes vet to a required check.
  vet:
    name: vet (OSS dependency policy)
    if: ${{ inputs.enable-vet }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # NOTE: write perms (pull-requests/issues) are intentionally omitted.
      # vet runs warn-only (continue-on-error) and reports to the step summary,
      # so it doesn't need to comment/open issues — and keeping security-scan's
      # footprint read-only is what lets required.yml call it cross-repo without
      # forcing every consumer's gate to grant write scopes. Promote vet to a
      # standalone opt-in workflow if PR comments are wanted.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Run safedep/vet
        uses: safedep/vet-action@6247cccd1b6683a27946ea3a0d45d3865346918b  # v1.1.12
        with:
          policy: .github/vet/policy.yml
          exception-file: .github/vet/exceptions.yml
          exclude: "**/vendor/**, .cargo/**, **/node_modules/**, **/target/**, .worktrees/**"
          trusted-registries: "https://crates.io,https://registry.npmjs.org,https://pypi.org,https://api.nuget.org"
          upload-sarif: false      # private repos w/o GHAS — use step summary
          cloud-key: ${{ secrets.SAFEDEP_CLOUD_KEY }}
          cloud-tenant: ${{ secrets.SAFEDEP_CLOUD_TENANT }}
        continue-on-error: true    # SOFT-LAUNCH: warn-only until promoted to required

  # ── CodeQL ────────────────────────────────────────────────────────────────
  # CodeQL is handled by GitHub's repo-level "default setup" (Settings →
  # Code security → CodeQL analysis). Running a matrix job here conflicts
  # with default setup ("analyses from advanced configurations cannot be
  # processed when the default setup is enabled") — so the job is a no-op
  # unless `languages` is explicitly set AND the caller has disabled
  # default setup in repo settings.
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ inputs.languages != '' && inputs.languages != '[]' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write
      # `actions: read` is required by github/codeql-action's telemetry —
      # init/analyze each call `GET /repos/{owner}/{repo}/actions/runs/{run_id}`.
      # Without the scope every step ends in
      #   ##[error]Resource not accessible by integration
      # and the job fails. Read-only; grants no write capability.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          submodules: ${{ inputs.submodules }}
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v3
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v3
        with:
          category: "/language:${{ matrix.language }}"
        continue-on-error: true   # default-setup collision otherwise fails

  # ── Gitleaks ──────────────────────────────────────────────────────────────
  # The MIT gitleaks CLI, pinned by version and checksum — deliberately NOT
  # gitleaks/gitleaks-action. That Action is a separate product under a
  # proprietary Gitleaks LLC EULA which requires a paid licence key for any
  # repository owned by an Organization account. The CLI downloaded here is
  # the MIT-licensed tool and carries no such terms and no key.
  #
  # Linux x86-64 only: the pinned asset and checksum are for that platform.
  gitleaks:
    name: gitleaks
    if: ${{ inputs.enable-gitleaks }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          # Load-bearing, not boilerplate: on a shallow clone gitleaks scans
          # only the tip commit and reports "no leaks found" for a secret
          # that is sitting in history.
          fetch-depth: 0
      - name: Install + run gitleaks
        shell: bash
        env:
          # Bump both together; the checksum is from the release's own
          # gitleaks_<version>_checksums.txt.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          # Fail fast and legibly on a runner this job cannot serve. Neither
          # mismatch is a silent pass -- an arm64 runner dies on the binary
          # with "Exec format error" and macOS has no sha256sum -- but a
          # reusable workflow should name the contract it broke rather than
          # leave a caller reading a libc error.
          if [ "$(uname -s)" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "::error::The gitleaks job requires a Linux x86-64 runner; got $(uname -s) $(uname -m). Point the runner input at a Linux x86-64 label, or set enable-gitleaks: false."
            exit 1
          fi
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          # Verify BEFORE executing. The release is not marked immutable, so
          # this checksum is what actually provides integrity here.
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" gitleaks
          # `gitleaks git <path>` on something that is not a git repository
          # logs an error and still exits 0 with "no leaks found". Assert the
          # checkout is a real repo so a misconfiguration cannot green-light
          # the scan.
          git rev-parse --git-dir > /dev/null
          # --exit-code 2 separates the two outcomes that both default to 1:
          # 2 = secrets found, 1 = gitleaks itself failed to run.
          ./gitleaks git . --no-banner --redact --exit-code 2 || {
            rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::error::gitleaks found secrets in git history — see the log above."
            else
              echo "::error::gitleaks failed to run (exit $rc); this is a tool/config failure, not a clean scan."
            fi
            exit "$rc"
          }

  # ── OSV-Scanner ───────────────────────────────────────────────────────────
  osv-scanner:
    name: osv-scanner
    if: ${{ inputs.enable-osv }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version: "stable"  # osv-scanner v2.3.5 needs Go ≥ 1.26.1
      - name: Install + run OSV-Scanner
        run: |
          set -euxo pipefail
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.5
          # Exit 128 from osv-scanner = "no package sources found"; treat as
          # success for scripts-only / manifest-free repos.
          "$(go env GOPATH)/bin/osv-scanner" scan source --recursive ./ || {
            rc=$?
            if [ "$rc" -eq 128 ]; then
              echo "osv-scanner: no package sources in this repo — skipping."
              exit 0
            fi
            exit "$rc"
          }

  # ── Dependency Review (PR only) ───────────────────────────────────────────
  dependency-review:
    name: dependency-review
    if: ${{ inputs.enable-dependency-review && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ── zizmor (workflow-YAML security audit) ─────────────────────────────────
  zizmor:
    name: zizmor
    if: ${{ inputs.enable-zizmor }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write
      # Required by github/codeql-action/upload-sarif's telemetry call
      # to `GET /repos/{owner}/{repo}/actions/runs/{run_id}`. Without
      # this the upload step ends in
      #   ##[error]Resource not accessible by integration
      # and fails the job. Read-only; grants no write capability.
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      # uv (single static binary) instead of pipx: pipx isn't guaranteed on
      # self-hosted runners, and `uvx zizmor` needs no pre-installed Python
      # tooling. Works identically on GitHub-hosted.
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Run zizmor
        run: uvx zizmor --format sarif .github/workflows/ > zizmor.sarif
        continue-on-error: true
      - name: Upload zizmor SARIF
        if: always() && hashFiles('zizmor.sarif') != ''
        # Best-effort: code-scanning SARIF upload requires GitHub Advanced
        # Security. On private repos without GHAS it 403s — don't fail the job
        # over it (the scan still ran; findings are in the step log/artifact).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # ── actionlint (workflow-YAML correctness lint) ───────────────────────────
  actionlint:
    name: actionlint
    if: ${{ inputs.enable-actionlint }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Install + run actionlint
        run: |
          set -euxo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # Skip gh-aw generated *.lock.yml (machine-generated; validated by `gh aw lint`).
          files=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name '*.lock.yml' | sort)
          if [ -n "$files" ]; then ./actionlint -color $files; else echo 'no hand-written workflows to lint'; fi

  # ── Semgrep (opt-in SAST) ─────────────────────────────────────────────────
  semgrep:
    name: semgrep
    if: ${{ inputs.enable-semgrep }}
    runs-on: ${{ inputs.runner }}
    container:
      image: semgrep/semgrep
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Run Semgrep CI
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── Snyk (opt-in) ─────────────────────────────────────────────────────────
  snyk:
    name: snyk
    if: ${{ inputs.enable-snyk }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Run Snyk
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04  # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Upload Snyk SARIF
        if: always() && hashFiles('snyk.sarif') != ''
        # Best-effort upload (GHAS-only); don't fail the job on no-GHAS repos.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v3
        with:
          sarif_file: snyk.sarif
          category: snyk

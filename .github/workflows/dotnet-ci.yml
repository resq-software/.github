#
# Reusable .NET CI — restore, build, test, format check. Callable from
# any resq-software/* repo with a .sln or csproj tree. Pairs with
# security-scan.yml. SHA-pinned actions with trailing `# <tag>`.

name: dotnet-ci

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version (e.g. "9.0.x", or "global.json").
        type: string
        required: false
        default: "9.0.x"
      solution:
        description: Path to .sln or csproj (defaults to repo root auto-detect).
        type: string
        required: false
        default: ""
      working-directory:
        type: string
        required: false
        default: "."
      configuration:
        type: string
        required: false
        default: "Release"
      run-format-check:
        type: boolean
        required: false
        default: true
      run-test:
        type: boolean
        required: false
        default: true
      timeout-minutes:
        type: number
        required: false
        default: 20

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore
        run: dotnet restore ${{ inputs.solution }}
      - name: Build
        run: dotnet build ${{ inputs.solution }} -c ${{ inputs.configuration }} --no-restore

  format:
    if: ${{ inputs.run-format-check }}
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet format ${{ inputs.solution }} --verify-no-changes --severity warn

  test:
    if: ${{ inputs.run-test }}
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25  # v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - run: dotnet test ${{ inputs.solution }} -c ${{ inputs.configuration }} --verbosity normal

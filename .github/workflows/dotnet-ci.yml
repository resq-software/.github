#
# Reusable .NET CI — restore, build, test, format check. Callable from
# any resq-software/* repo with a .sln or csproj tree. Pairs with
# security-scan.yml.
#
# Security: caller-controlled string inputs are forwarded through env:
# and expanded by bash directly (not via `sh -c`, which would re-parse
# and reintroduce the injection path).

name: dotnet-ci

on:
  workflow_call:
    inputs:
      dotnet-version:
        type: string
        required: false
        default: "9.0.x"
      solution:
        description: Path to .sln or .csproj (empty = dotnet auto-detect).
        type: string
        required: false
        default: ""
      working-directory:
        type: string
        required: false
        default: "."
      configuration:
        type: string
        required: false
        default: "Release"
      run-format-check:
        type: boolean
        required: false
        default: true
      run-test:
        type: boolean
        required: false
        default: true
      timeout-minutes:
        type: number
        required: false
        default: 20
      submodules:
        description: >
          Checkout submodules. Pass 'true' for top-level,
          'recursive' for nested, or '' to skip (default).
        type: string
        required: false
        default: ""
      fetch-depth:
        description: >
          Commit history depth for checkout. Default 1 (shallow) preserves
          existing behaviour. Set to 0 for a repo using MinVer or any other
          git-tag-derived versioning: those need full history AND tags, and
          without them MinVer silently computes 0.0.0-alpha.0 rather than
          failing. This workflow only builds and tests, so a wrong version
          here does not publish — but a repo that adds a pack step would
          ship it. See docs/standards/06-versioning.md.
        type: number
        required: false
        default: 1

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore
        env:
          SLN: ${{ inputs.solution }}
        run: |
          # $SLN may be empty (auto-detect) or a path — unquoted
          # expansion handles both without re-parsing.
          # shellcheck disable=SC2086
          dotnet restore $SLN
      - name: Build
        env:
          SLN: ${{ inputs.solution }}
          CONFIG: ${{ inputs.configuration }}
        run: |
          # shellcheck disable=SC2086
          dotnet build $SLN -c "$CONFIG" --no-restore

  format:
    if: ${{ inputs.run-format-check }}
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: dotnet format
        env:
          SLN: ${{ inputs.solution }}
        run: |
          # shellcheck disable=SC2086
          dotnet format $SLN --verify-no-changes --severity warn

  test:
    if: ${{ inputs.run-test }}
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: dotnet test
        env:
          SLN: ${{ inputs.solution }}
          CONFIG: ${{ inputs.configuration }}
        run: |
          # shellcheck disable=SC2086
          dotnet test $SLN -c "$CONFIG" --verbosity normal

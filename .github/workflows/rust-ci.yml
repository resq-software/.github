#
# Reusable Rust CI — fmt + clippy + test (opt coverage) + cargo-deny.
# Pairs with security-scan.yml. SHA-pinned actions with trailing `# <tag>`.
#
# Security: caller-controlled string flags are forwarded through `env:`.

name: rust-ci

on:
  workflow_call:
    inputs:
      toolchain:
        type: string
        required: false
        default: stable
      components:
        type: string
        required: false
        default: rustfmt,clippy
      working-directory:
        type: string
        required: false
        default: "."
      run-fmt:
        type: boolean
        required: false
        default: true
      run-clippy:
        type: boolean
        required: false
        default: true
      run-test:
        type: boolean
        required: false
        default: true
      run-deny:
        type: boolean
        required: false
        default: false
      run-coverage:
        type: boolean
        required: false
        default: false
      clippy-flags:
        type: string
        required: false
        default: "--all-targets --all-features -- -D warnings"
      test-flags:
        type: string
        required: false
        default: "--all-features --workspace"
      timeout-minutes:
        type: number
        required: false
        default: 20

permissions:
  contents: read

jobs:
  fmt:
    if: ${{ inputs.run-fmt }}
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    if: ${{ inputs.run-clippy }}
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: ${{ inputs.components }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          # Registry-only: cache the downloaded ~/.cargo crates, NOT compiled
          # target/ artifacts. Removes the two real risks of build-artifact
          # caching — a poisoned/stale compiled artifact entering a build, and
          # secrets a tool may serialize into target/ leaking via a PR-readable
          # cache (the 2026 Miri advisory). Trades some compile-cache speed for a
          # near-zero threat surface.
          cache-targets: "false"
          # Only main writes cache entries; PRs (and other low-trust refs)
          # restore-only. Closes the untrusted-write cache-poisoning vector.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        env:
          FLAGS: ${{ inputs.clippy-flags }}
        run: |
          # shellcheck disable=SC2086
          cargo clippy $FLAGS

  test:
    if: ${{ inputs.run-test }}
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: ${{ inputs.components }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          # Registry-only: cache the downloaded ~/.cargo crates, NOT compiled
          # target/ artifacts. Removes the two real risks of build-artifact
          # caching — a poisoned/stale compiled artifact entering a build, and
          # secrets a tool may serialize into target/ leaking via a PR-readable
          # cache (the 2026 Miri advisory). Trades some compile-cache speed for a
          # near-zero threat surface.
          cache-targets: "false"
          # Only main writes cache entries; PRs (and other low-trust refs)
          # restore-only. Closes the untrusted-write cache-poisoning vector.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ !inputs.run-coverage }}
        name: cargo test
        env:
          FLAGS: ${{ inputs.test-flags }}
        run: |
          # shellcheck disable=SC2086
          cargo test $FLAGS
      - if: ${{ inputs.run-coverage }}
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908  # v2.87.15
        with:
          tool: cargo-llvm-cov
      - if: ${{ inputs.run-coverage }}
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - if: ${{ inputs.run-coverage && always() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ${{ inputs.working-directory }}/lcov.info
          fail_ci_if_error: false

  deny:
    if: ${{ inputs.run-deny }}
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Runs on the consumer's rust-toolchain.toml so custom targets
      # (e.g. x86_64-unknown-linux-musl) resolve correctly. The Docker-
      # based EmbarkStudios/cargo-deny-action did not respect
      # rust-toolchain.toml and failed with "override toolchain not
      # installed" when the consumer pinned a non-default target.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908  # v2.87.15
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check
